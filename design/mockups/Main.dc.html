<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F766E}a:hover{color:#115E59}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F4; font-family: Inter, sans-serif; color: #15181C; display: flex; flex-direction: column">
  <div style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 20px; flex-grow: 1">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #5B6168">Thursday, 19 November</span>
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600">Today</h1>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; background: #DDF1EC; color: #0B5D55; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 999px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #0F766E"></span>In office
      </span>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <div style="position: relative; width: 200px; height: 200px">
        <svg width="200" height="200" viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="88" fill="none" stroke="#E6E8E5" stroke-width="14"></circle>
          <circle cx="100" cy="100" r="88" fill="none" stroke="{{accent}}" stroke-width="14" stroke-linecap="round" stroke-dasharray="368.6 552.9" transform="rotate(-90 100 100)"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 40px; font-weight: 600">2h 40m</span>
          <span style="font-size: 14px; color: #5B6168">of 4h goal</span>
        </div>
      </div>
      <p style="margin: 0; font-size: 15px; color: #3A4047; text-align: center">1h 20m more and today counts as an office day</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%">
        <div style="background: #F5F6F4; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; color: #5B6168">Arrived</span>
          <span style="font-size: 17px; font-weight: 600">9:12 am</span>
        </div>
        <div style="background: #F5F6F4; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; color: #5B6168">Detected by</span>
          <span style="font-size: 17px; font-weight: 600">GPS + Wi‑Fi</span>
        </div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; font-weight: 600">November</span>
        <span style="font-size: 13px; color: #5B6168">7 of 10 office days</span>
      </div>
      <div style="height: 10px; background: #E6E8E5; border-radius: 999px; overflow: hidden">
        <div style="width: 70%; height: 10px; background: {{accent}}; border-radius: 999px"></div>
      </div>
      <span style="font-size: 13px; color: #3A4047">3 more days needed · 7 working days left</span>
    </div>

    <button style="height: 52px; border: 1.5px solid #C9CDC8; background: transparent; border-radius: 16px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; color: #15181C; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
      Fix today manually
    </button>
  </div>

  <nav style="height: 72px; background: #FFFFFF; border-top: 1px solid #E6E8E5; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0B5D55; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Today</a>
    <a href="Calendar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6168; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendar</a>
    <a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6168; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Stats</a>
    <a href="Setup.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6168; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12Z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>Office</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F766E","options":["#0F766E","#2563EB","#7C3AED","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0F766E' };
  }
}
</script>
</body>
</html>
