<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Office setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F766E}a:hover{color:#115E59}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F4; font-family: Inter, sans-serif; color: #15181C; display: flex; flex-direction: column">
  <div style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600">Your office</h1>

    <div style="position: relative; height: 170px; border-radius: 20px; overflow: hidden; background: #E9EDE6">
      <div style="position: absolute; left: 0; right: 0; top: 70px; height: 14px; background: #FFFFFF"></div>
      <div style="position: absolute; left: 0; right: 0; top: 150px; height: 10px; background: #FFFFFF"></div>
      <div style="position: absolute; top: 0; bottom: 0; left: 120px; width: 14px; background: #FFFFFF"></div>
      <div style="position: absolute; top: 0; bottom: 0; left: 270px; width: 10px; background: #FFFFFF"></div>
      <div style="position: absolute; left: 120px; top: 10px; width: 150px; height: 150px; border-radius: 50%; background: rgba(15,118,110,0.16); border: 2px solid #0F766E; box-sizing: border-box"></div>
      <svg style="position: absolute; left: 179px; top: 46px" width="32" height="40" viewBox="0 0 24 30" role="img" aria-label="Office location pin"><path d="M12 29s-10-9-10-17a10 10 0 0 1 20 0c0 8-10 17-10 17Z" fill="#0F766E"></path><circle cx="12" cy="12" r="4" fill="#FFFFFF"></circle></svg>
      <span style="position: absolute; right: 10px; bottom: 10px; background: #FFFFFF; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px">Drag pin to adjust</span>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3A4047">Address
      <input value="[YOUR OFFICE ADDRESS], Sydney NSW" style="height: 48px; border: 1.5px solid #C9CDC8; border-radius: 14px; padding: 0 14px; font-family: Inter, sans-serif; font-size: 15px; color: #15181C; background: #FFFFFF">
    </label>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <label style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 600">Geofence radius <span style="color: #0B5D55">150 m</span></label>
      <input type="range" min="50" max="500" value="150" aria-label="Geofence radius" style="width: 100%; accent-color: #0F766E">
      <div style="height: 1px; background: #E6E8E5"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Confirm with office Wi‑Fi</span>
          <span style="font-size: 13px; color: #5B6168">Saved network: [OFFICE WI‑FI]</span>
        </div>
        <button aria-label="Confirm with office Wi-Fi: on" style="width: 52px; height: 32px; border: none; border-radius: 999px; background: #0F766E; position: relative; flex-shrink: 0">
          <span style="position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span>
        </button>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
      <span style="font-size: 15px; font-weight: 600">Counting rules</span>
      <div style="display: flex; justify-content: space-between"><span style="color: #3A4047">Counts as office day after</span><span style="font-weight: 600">4 h</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #3A4047">Ignore short exits under</span><span style="font-weight: 600">15 min</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #3A4047">Work days</span><span style="font-weight: 600">Mon – Fri</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #3A4047">Monthly target</span><span style="font-weight: 600">50%</span></div>
    </div>

    <a href="Backup.dc.html" style="height: 52px; box-sizing: border-box; background: #FFFFFF; border-radius: 16px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #15181C">
      <span style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.5 13 3.5 3.5 0 0 0 6.5 19Z"></path></svg>
        Backup &amp; restore
      </span>
      <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #5B6168">Drive · on
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </span>
    </a>
  </div>

  <nav style="height: 72px; background: #FFFFFF; border-top: 1px solid #E6E8E5; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6168; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Today</a>
    <a href="Calendar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6168; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendar</a>
    <a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6168; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Stats</a>
    <a href="Setup.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0B5D55; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12Z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>Office</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
